##############################################################################
# Basic                                                                      #
##############################################################################
# Configure base url, e.g. http://domain:port, without '/'. Temporary disabled to use default.
#MCR.baseurl=
# Requires MCR.baseurl, therefore temporary disabled.
#MIR.CanonicalBaseURL=%MCR.baseurl%/
MCR.NameOfProject=WIAS
MIR.projectid.default=wias
MIR.testEnvironment=false
MCR.Metadata.Languages=de,en

##############################################################################
# Email                                                                      #
##############################################################################
MCR.Mail.Server=
# General sender mail address, e.g. mail@domain
MCR.Mail.Sender=

# Mail for events including self registration, e.g. <name> mail@domain
MCR.mir-module.EditorMail=
# Sender email for events, e.g. <name> mail@domain
MCR.mir-module.MailSender=

MCR.mir-module.NewUserMail=

##############################################################################
# Access Control                                                             #
##############################################################################
# Access keys are not relevant and must therefore be deactivated as follows.
MCR.ACL.AccessKey.Strategy.AllowedObjectTypes=
MIR.Access.Strategy.Classifications=mir_access,state
MCR.Access.Strategy.Class=de.vzg.reposis.wias.WiasStrategy

# handle imported state also as "submitted" state
MCR.Access.Strategy.SubmittedCategory=state:submitted,state:imported

MIR.Strategy.EditPIRoles=admin,editor

##############################################################################
# Editor                                                                     #
##############################################################################
MIR.EditorForms.CustomIncludes=%MIR.EditorForms.CustomIncludes%,xslStyle:editor/mir2xeditor:webapp:editor/editor-customization.xed
#MIR.Editor.Default.State=new
#MIR.Editor.repeat.max.subject.simple=40
#MIR.Editor.repeat.max.subject.simple.required=40

##############################################################################
# Frontend                                                                   #
##############################################################################
MIR.CustomLayout.JS=wias.js


MCR.user2.RoleCategories=%MCR.user2.RoleCategories%,wias_research_group

# Maximum number of publications that can be outputted within toc
MIR.TableOfContents.MaxResults=10000

MIR.Workflow.Menu=true
MIR.Workflow.Box=true

# disable classification sorting
MCR.URIResolver.Classification.Sort.wias_research_group=false

# specify format for classification output in editor
MCR.URIResolver.Classification.Format.textDescription={text} - {description}

##############################################################################
# DOI                                                                        #
##############################################################################
  MCR.PI.MetadataService.MODSDOI.Prefix=10.20347
  MCR.DOI.HostingInstitution=Weierstrass Institute
  MCR.PI.MetadataService.MODSDOI.Type=doi

  #MCR.PI.Service.Datacite=org.mycore.pi.doi.MCRDOIService
  MCR.PI.Service.Datacite.Generator=DOIGenerator
  MCR.PI.Service.Datacite.MetadataService=MODSDOI
  MCR.PI.Service.Datacite.Username=
  MCR.PI.Service.Datacite.Password=
  MCR.PI.Service.Datacite.Transformer=datacite
  MCR.PI.Service.Datacite.RegistrationPredicate=org.mycore.pi.condition.MCRPIPublishedPredicate
  MCR.PI.Service.Datacite.RegisterBaseURL=https://archive.wias-berlin.de/

  MCR.PI.Generator.DOIGenerator=de.vzg.reposis.wias.WiasDOIGenerator
  MCR.PI.Generator.DOIGenerator.Prefix=10.20347
  MCR.PI.Generator.DOIGenerator.PreprintSeriesId=wias_mods_00000012
  MCR.PI.Generator.DOIGenerator.AnnualReportSeriesId=wias_mods_00000034
  MCR.PI.Generator.DOIGenerator.TechReportSeriesId=wias_mods_00000035
  MCR.PI.Generator.DOIGenerator.ReportSeriesId=wias_mods_00000021

##############################################################################
# OAI                                                                        #
##############################################################################
MCR.OAIDataProvider.OAI2.RepositoryName=Weierstra\u00DF-Institut f\u00FCr Angewandte Analysis und Stochastik
MCR.OAIDataProvider.OAI2.RepositoryIdentifier=
MCR.OAIDataProvider.OAI2.AdminEmail=
MCR.OAIDataProvider.OAI2.DescriptionURI.EPrints=webapp:oai/oai-eprints.xml
MCR.OAIDataProvider.OAI2.DescriptionURI.Rights=webapp:oai/oai-rights.xml
MCR.OAIDataProvider.OAI2.RecordSampleID=mir_mods_00000003

# Metadata formats
MCR.OAIDataProvider.OAI2.MetadataFormats=oai_dc,mods,epicur,oai_datacite,xMetaDissPlus
MCR.OAIDataProvider.MetadataFormat.oai_datacite.Namespace=http://schema.datacite.org/oai/oai-1.0/
MCR.OAIDataProvider.MetadataFormat.oai_datacite.Schema=http://schema.datacite.org/oai/oai-1.0/oai_datacite.xsd

# Set specifications
MCR.OAIDataProvider.OAI2.Sets=doc-type,open_access,openaire,driver,ec_fundedresources,GENRE,ddc,xmetadissplus

# xMetaDissPlus
MCR.OAIDataProvider.MetadataFormat.xMetaDissPlus.Schema=http://files.dnb.de/standards/xmetadissplus/xmetadissplus.xsd
MCR.OAIDataProvider.MetadataFormat.xMetaDissPlus.Namespace=http://www.d-nb.de/standards/xmetadissplus/
MCR.OAIDataProvider.OAI2.MapSetToQuery.xmetadissplus.Query={!join from=returnId to=id}derivateURN:*
MCR.OAIDataProvider.OAI2.Sets.xmetadissplus.URI=webapp:oai/set_xmetadissplus.xml

# If name, place and the address of the repository owner.
MCR.OAIDataProvider.RepositoryPublisherName=Weierstra\u00DF-Institut f\u00FCr Angewandte Analysis und Stochastik\r\nLeibniz-Institut im Forschungsverbund Berlin e. V.
MCR.OAIDataProvider.RepositoryPublisherPlace=Berlin
MCR.OAIDataProvider.RepositoryPublisherAddress=Mohrenstr. 39

# friendly OAI interfaces
MCR.OAIDataProvider.OAI2.Friends.OpenAgrar=https://openagrar.bmel-forschung.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.DuEPublico=https://duepublico.uni-duisburg-essen.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.DBThueringen=https://www.db-thueringen.de/servlets/OAIDataProvider
MCR.OAIDataProvider.OAI2.Friends.RosDok=https://rosdok.uni-rostock.de/oai


